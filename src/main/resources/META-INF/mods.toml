# Wavify — Forge mod metadata (replaces fabric.mod.json).
# See https://docs.minecraftforge.net/en/latest/gettingstarted/modfiles/#modstoml

modLoader="javafml"
# javafml loader version == Forge version. Forge bumps its major per 26.1.x hotfix:
# 26.1 -> 62, 26.1.1 -> 63, 26.1.2 -> 64. [62,65) covers the whole 26.1 drop and blocks 26.2's Forge.
loaderVersion="[62,65)"
license="MIT"
issueTrackerURL="https://github.com/BlankDEVgit/Forge-Wavify/issues"

# Wavify is a purely client-side mod (Fabric original used "environment": "client").
# clientSideOnly=true makes dedicated servers ignore it and sets displayTest to IGNORE_ALL_VERSION,
# so vanilla/other clients can still connect to a server that does not have the mod.
clientSideOnly=true

[[mods]]
modId="wavify"
version="${file.jarVersion}"
displayName="Forge-Wavify"
logoFile="icon.png"
authors="BlankDEVgit"
credits="Forge port by BlankDEVgit. Based on Wavify (by icywhenhot), itself a fork of Tidal by Superkat32."
description='''Adds ambient waves to beaches and oceans!'''

[[dependencies.wavify]]
    modId="forge"
    mandatory=true
    versionRange="[62,65)"
    ordering="NONE"
    side="CLIENT"

[[dependencies.wavify]]
    modId="minecraft"
    mandatory=true
    versionRange="[26.1,26.2)"
    ordering="NONE"
    side="CLIENT"

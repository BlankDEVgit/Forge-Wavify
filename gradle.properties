# Gradle daemon / performance settings (taken from the official Forge 26.1 MDK)
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configureondemand=true

org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
org.gradle.configuration-cache.problems=warn

# ForgeGradle 7 merges the main/test source sets so dev runs see resources without an extra copy step.
net.minecraftforge.gradle.merge-source-sets=true

## Mod / platform versions
# Minecraft now uses the year.drop.hotfix scheme; 26.1.2 is the second hotfix of the first 2026 drop.
minecraft_version=26.1.2
# MinecraftForge build for 26.1.2 (https://files.minecraftforge.net/net/minecraftforge/forge/index_26.1.2.html)
forge_version=64.0.8
mod_id=wavify
mod_version=1.0.0
mod_group=net.superkat
